<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>We've moved — Dane</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main { width: min(100%, 560px); }
    .sun {
      width: 54px;
      height: 54px;
      margin: 0 auto 28px;
      border: 5px solid #ff8a24;
      border-radius: 50%;
      position: relative;
    }
    .sun::before {
      content: "";
      position: absolute;
      width: 5px;
      height: 19px;
      background: #ff8a24;
      border-radius: 5px;
      top: -25px;
      left: 20px;
    }
    h1 { font-size: clamp(2.2rem, 8vw, 3.5rem); margin: 0 0 14px; }
    p { color: #c9c9c9; font-size: 1.1rem; line-height: 1.6; margin: 0 0 30px; }
    a {
      display: inline-block;
      padding: 16px 24px;
      border-radius: 12px;
      background: #ff8a24;
      color: #111;
      font-weight: 700;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }
    a:hover { background: #ffa34f; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .brand { margin-top: 34px; color: #888; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <h1>We've moved!</h1>
    <p>Our new website is here. Visit Dane using the button below.</p>
    <a href="https://daneai.vercel.app">TAP HERE TO GO TO DANE</a>
    <div class="brand">Dane</div>
  </main>
</body>
</html>
